name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hostinger
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}

      - name: Update .env on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          ZEROGPT_API_KEY: ${{ secrets.ZEROGPT_API_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: ZEROGPT_API_KEY,DROPBOX_REFRESH_TOKEN,AZURE_CLIENT_ID,AZURE_CLIENT_SECRET,AZURE_TENANT_ID
          script: |
            cat > ~/.env << EOF
            ZEROGPT_API_KEY=$ZEROGPT_API_KEY
            DROPBOX_REFRESH_TOKEN=$DROPBOX_REFRESH_TOKEN
            AZURE_CLIENT_ID=$AZURE_CLIENT_ID
            AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET
            AZURE_TENANT_ID=$AZURE_TENANT_ID
            EMAIL_FROM=no-reply@ptacademy.com
            EMAIL_TO=sam.jones@ptacademy.com
            PORT=5001
            FLASK_ENV=production
            FLASK_DEBUG=false
            EOF
            cp ~/.env /docker/ptacademy_aidetector/.env
