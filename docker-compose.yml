services:
  ai-detector:
    build: .
    restart: always
    env_file:
      - /root/.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.ai-detector.rule=Host(`ptacademyaidetector.cloud`)
      - traefik.http.routers.ai-detector.tls=true
      - traefik.http.routers.ai-detector.entrypoints=web,websecure
      - traefik.http.routers.ai-detector.tls.certresolver=mytlschallenge
      - traefik.http.services.ai-detector.loadbalancer.server.port=5001
      - traefik.http.services.ai-detector.loadbalancer.responseforwarding.flushinterval=-1
    # Secrets (ZEROGPT_API_KEY, DROPBOX_REFRESH_TOKEN, AZURE_*, EMAIL_*) come
    # from /root/.env above, which the GitHub Action writes from GitHub Secrets.
    # Do NOT re-declare secrets here via ${...}: `environment` overrides
    # `env_file`, so a reset Hostinger panel would clobber the real values with
    # placeholders. Only non-secret runtime literals belong here.
    environment:
      - PORT=5001
      - FLASK_ENV=production
      - FLASK_DEBUG=false
    networks:
      - n8n_default

networks:
  n8n_default:
    external: true
